- name: Send Discord notification
  env:
    DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
    PR_TITLE: ${{ github.event.pull_request.title }}
    PR_BODY: ${{ github.event.pull_request.body }}
    PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    PR_URL: ${{ github.event.pull_request.html_url }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_MERGED: ${{ github.event.pull_request.merged }}
    PR_MERGER: ${{ github.event.pull_request.merged_by.login || '' }}
    GITHUB_EVENT_ACTION: ${{ github.event.action }}
  run: |
    echo "DISCORD_WEBHOOK is: $DISCORD_WEBHOOK"  # DEBUG ONLY, remove this after verifying

    if [ "${PR_MERGED}" = "true" ]; then
      MESSAGE="✅ Pull Request #${PR_NUMBER} successfully merged by ${PR_MERGER}:\n**${PR_TITLE}**\n${PR_URL}"
    else
      MESSAGE="📢 Pull Request #${PR_NUMBER} ${GITHUB_EVENT_ACTION} by ${PR_AUTHOR}:\n**${PR_TITLE}**\n${PR_URL}"
    fi

    PAYLOAD=$( jq -n \
      --arg content "$MESSAGE" \
      '{content: $content}' )

    curl -H "Content-Type: application/json" \
         -X POST \
         -d "$PAYLOAD" \
         "$DISCORD_WEBHOOK"
